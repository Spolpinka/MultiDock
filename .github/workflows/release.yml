name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: bash build.sh

      - name: Package
        run: ditto -c -k --keepParent MultiDock.app MultiDock.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiDock
          path: MultiDock.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" MultiDock.zip --generate-notes --title "MultiDock $GITHUB_REF_NAME"
